<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0808" />
      <stop offset="50%" stop-color="#2a0d0d" />
      <stop offset="100%" stop-color="#060404" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d72626" />
      <stop offset="100%" stop-color="#d4a017" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="150" cy="120" r="180" fill="#d72626" opacity="0.15" filter="blur(80px)" />
  <circle cx="1050" cy="500" r="220" fill="#d4a017" opacity="0.15" filter="blur(90px)" />

  <!-- Icon / Badge -->
  <rect x="100" y="90" width="64" height="64" rx="16" fill="url(#brand)" />
  <path d="M124 110 L140 110 M132 110 L132 134 M120 122 L144 122" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <text x="180" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Token-Max
  </text>

  <!-- Main Headline -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    AI Model &amp; Coding Plan
  </text>
  <text x="100" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="url(#brand)" letter-spacing="-1.5">
    Usage &amp; Pricing Tracker
  </text>

  <!-- Subtitle -->
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Translating vague "credits" and "requests" into definitive token counts.
  </text>
  <text x="100" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Compare 440+ models, 32+ coding agent tiers, benchmarks &amp; TOS gotchas.
  </text>

  <!-- Metrics Cards -->
  <g transform="translate(100, 470)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="90" rx="14" fill="#231616" stroke="#4a2020" stroke-width="1" />
    <text x="24" y="42" font-family="sans-serif" font-size="30" font-weight="800" fill="#d72626">440+</text>
    <text x="24" y="68" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Live AI Models</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="90" rx="14" fill="#231616" stroke="#4a2020" stroke-width="1" />
    <text x="274" y="42" font-family="sans-serif" font-size="30" font-weight="800" fill="#d4a017">32+</text>
    <text x="274" y="68" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Curated Plans</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="90" rx="14" fill="#231616" stroke="#4a2020" stroke-width="1" />
    <text x="524" y="42" font-family="sans-serif" font-size="30" font-weight="800" fill="#da5a3a">100%</text>
    <text x="524" y="68" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Free &amp; Open Source</text>
  </g>
</svg>
